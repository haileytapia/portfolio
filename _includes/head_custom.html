<style>
  /* --- High-Impact Developer Panel Tabs --- */
  .content-tab-container {
    margin: 2rem 0;
    background: #ffffff;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    overflow: hidden;
  }

  .content-tab-header {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    background: #0f172a; /* Rich, high-contrast dark slate header for serious visual punch */
    padding: 8px 12px 0 12px;
    gap: 6px;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
    border-bottom: 1px solid #1e293b;
  }

  .content-tab-btn {
    background: transparent;
    border: none;
    padding: 8px 16px;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    color: #94a3b8; /* Crisp, legible muted text on dark */
    border-radius: 6px 6px 0 0;
    transition: all 0.15s ease;
  }

  .content-tab-btn:hover {
    color: #f8fafc;
    background: rgba(255, 255, 255, 0.06);
  }

  .content-tab-btn.active {
    color: #ffffff;
    background: #1e293b; /* Lighter dark surface to anchor the active tab */
    font-weight: 600;
    border-top: 2px solid #8b5cf6; /* Vibrant technical purple accent */
    box-shadow: 0 -2px 6px rgba(139, 92, 246, 0.3);
  }

  .content-tab-pane {
    display: none;
    padding: 1.5rem; /* Snug, tight padding so content isn't floating too far from the borders */
    background-color: #ffffff;
  }

  .content-tab-pane.active {
    display: block;
    animation: fadeIn 0.15s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const savedTab = localStorage.getItem("portfolio-content-tab-pref");
    if (savedTab) {
      activateTab(savedTab);
    }

    document.addEventListener("click", function (event) {
      const button = event.target.closest(".content-tab-btn");
      if (!button) return;

      const targetLang = button.getAttribute("data-target");
      if (!targetLang) return;
      
      localStorage.setItem("portfolio-content-tab-pref", targetLang);
      activateTab(targetLang);
    });

    function activateTab(lang) {
      const containers = document.querySelectorAll(".content-tab-container");

      containers.forEach(container => {
        const buttons = container.querySelectorAll(".content-tab-btn");
        const panes = container.querySelectorAll(".content-tab-pane");

        let matched = false;

        buttons.forEach(btn => {
          if (btn.getAttribute("data-target") === lang) {
            btn.classList.add("active");
            matched = true;
          } else {
            btn.classList.remove("active");
          }
        });

        panes.forEach(pane => {
          if (pane.getAttribute("data-content") === lang) {
            pane.classList.add("active");
          } else {
            pane.classList.remove("active");
          }
        });
        
        if (!matched && buttons.length > 0) {
          buttons[0].classList.add("active");
          panes[0].classList.add("active");
        }
      });
    }
  });
</script>
