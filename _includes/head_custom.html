<style>
  /* --- Minimalist Trackless Documentation Tabs --- */
  .content-tab-container {
    margin: 2rem 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    overflow: hidden;
  }

  .content-tab-container--inline {
    margin: 1.25rem 0;
    width: fit-content;
    max-width: 100%;
    overflow: visible;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03);
  }

  .content-tab-container--inline .content-tab-header {
    padding: 0 0.75rem;
  }

  .content-tab-container--inline .content-tab-pane {
    padding: 1rem;
    background: #ffffff;
  }

  .content-tab-header {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 1.25rem;
    gap: 0.5rem;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .content-tab-btn {
    background: transparent;
    border: none;
    padding: 0.875rem 1.125rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    color: #64748b;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s ease;
  }

  .content-tab-btn:hover {
    color: #0f172a;
    background-color: #f8fafc;
    border-radius: 6px 6px 0 0;
  }

  .content-tab-btn.active {
    color: #7c3aed;
    font-weight: 600;
    border-bottom-color: #7c3aed;
    background: transparent;
  }

  .content-tab-pane {
    display: none;
    padding: 2rem;
    background-color: #ffffff;
  }

  .content-tab-pane > *:first-child {
    margin-top: 0 !important;
  }

  .content-tab-pane.active {
    display: block;
    animation: fadeIn 0.15s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const containers = Array.from(document.querySelectorAll(".content-tab-container"));
    const initializedGroups = new Set();

    containers.forEach(container => {
      const groupId = container.getAttribute("data-tab-group");
      const groupKey = groupId ? `group:${groupId}` : container;
      if (initializedGroups.has(groupKey)) return;
      initializedGroups.add(groupKey);

      const groupContainers = getGroupContainers(container);
      const buttons = groupContainers.flatMap(item =>
        Array.from(item.querySelectorAll(".content-tab-btn"))
      );
      const savedTab = groupId
        ? localStorage.getItem(`portfolio-content-tab-pref:${groupId}`)
        : null;
      const initialTab = savedTab || buttons[0]?.getAttribute("data-target");
      if (initialTab) activateTab(groupContainers, initialTab);
    });

    document.addEventListener("click", function (event) {
      const button = event.target.closest(".content-tab-btn");
      if (!button) return;

      const targetLang = button.getAttribute("data-target");
      if (!targetLang) return;

      const container = button.closest(".content-tab-container");
      if (!container) return;
      const groupId = container.getAttribute("data-tab-group");
      if (groupId) {
        localStorage.setItem(`portfolio-content-tab-pref:${groupId}`, targetLang);
      }
      activateTab(getGroupContainers(container), targetLang);
    });

    function getGroupContainers(container) {
      const groupId = container.getAttribute("data-tab-group");
      if (!groupId) return [container];

      return containers.filter(item => item.getAttribute("data-tab-group") === groupId);
    }

    function activateTab(groupContainers, lang) {
      const buttons = groupContainers.flatMap(container =>
        Array.from(container.querySelectorAll(".content-tab-btn"))
      );
      const panes = groupContainers.flatMap(container =>
        Array.from(container.querySelectorAll(".content-tab-pane"))
      );
      const activeLang = buttons.some(btn => btn.getAttribute("data-target") === lang)
        ? lang
        : buttons[0]?.getAttribute("data-target");

      buttons.forEach(btn => {
        const isActive = btn.getAttribute("data-target") === activeLang;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      panes.forEach(pane => {
        pane.classList.toggle("active", pane.getAttribute("data-content") === activeLang);
      });
    }
  });
</script>

<style>
  .doc-toc-rail {
    position: fixed;
    z-index: 1000;
    top: 42vh;
    right: 0;
  }

  .doc-toc-toggle {
    display: block;
    padding: 0.75rem 0.5rem;
    border: 1px solid #d8dee8;
    border-right: 0;
    border-radius: 6px 0 0 6px;
    background: #ffffff;
    color: #334155;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
    cursor: pointer;
    font: inherit;
    font-size: 0.8rem;
    font-weight: 600;
    writing-mode: vertical-rl;
  }

  .doc-toc-toggle:focus-visible {
    outline: 2px solid #2563eb;
    outline-offset: 2px;
  }

  .doc-toc-panel {
    position: absolute;
    top: 0;
    right: calc(100% + 0.5rem);
    width: min(22rem, calc(100vw - 5rem));
    max-height: min(70vh, 36rem);
    overflow: auto;
    padding: 0.75rem 1rem;
    border: 1px solid #d8dee8;
    border-radius: 6px;
    background: #ffffff;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
  }

  .doc-toc-panel[hidden] {
    display: none;
  }

  .doc-toc-panel ul {
    display: grid;
    gap: 0.25rem;
    margin: 0;
    padding: 0;
    list-style: none !important;
  }

  .doc-toc-panel li,
  .doc-toc-panel li::before {
    margin: 0;
    padding: 0;
    content: none !important;
  }

  .doc-toc-panel a {
    display: block;
    padding: 0.35rem 0;
    color: #334155;
    text-decoration: none;
  }

  .doc-toc-panel a:hover {
    color: #1d4ed8;
    text-decoration: underline;
  }

  .doc-toc-panel a.toc-subheading {
    padding-left: 1rem;
    color: #64748b;
    font-size: 0.9em;
  }

  @media (max-width: 640px) {
    .doc-toc-rail {
      top: auto;
      bottom: 1rem;
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const mainContent = document.querySelector(".doc-main-content");
    const tocRail = document.getElementById("doc-toc-rail");
    const tocToggle = document.getElementById("doc-toc-toggle");
    const tocPanel = document.getElementById("auto-toc");

    if (!mainContent || !tocRail || !tocToggle || !tocPanel) return;

    const headings = Array.from(mainContent.querySelectorAll("h2, h3"))
      .filter(heading => !heading.closest(".content-tab-pane"));

    if (headings.length === 0) {
      tocRail.remove();
      return;
    }

    const list = document.createElement("ul");
    const usedIds = new Set();

    headings.forEach((heading, index) => {
      if (!heading.id) {
        const baseId = heading.textContent
          .toLowerCase()
          .replace(/[^\w]+/g, "-")
          .replace(/^-+|-+$/g, "") || `section-${index + 1}`;
        let headingId = baseId;
        let suffix = 2;
        while (document.getElementById(headingId) || usedIds.has(headingId)) {
          headingId = `${baseId}-${suffix++}`;
        }
        heading.id = headingId;
      }
      usedIds.add(heading.id);

      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent;
      if (heading.tagName === "H3") link.classList.add("toc-subheading");
      item.appendChild(link);
      list.appendChild(item);
    });

    tocPanel.appendChild(list);

    function setTocOpen(open) {
      tocPanel.hidden = !open;
      tocToggle.setAttribute("aria-expanded", String(open));
    }

    tocToggle.addEventListener("click", function () {
      setTocOpen(tocPanel.hidden);
    });

    tocRail.addEventListener("mouseenter", function () {
      setTocOpen(true);
    });

    tocRail.addEventListener("mouseleave", function () {
      if (!tocRail.matches(":focus-within")) setTocOpen(false);
    });

    tocRail.addEventListener("focusin", function () {
      setTocOpen(true);
    });

    tocRail.addEventListener("focusout", function (event) {
      if (!tocRail.contains(event.relatedTarget)) setTocOpen(false);
    });

    tocPanel.addEventListener("click", function (event) {
      if (event.target.closest("a")) setTocOpen(false);
    });

    tocRail.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        setTocOpen(false);
        tocToggle.focus();
      }
    });
  });
</script>
