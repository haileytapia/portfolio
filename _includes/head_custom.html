<style>
  /* --- High-End Developer Documentation Tabs (Stripe/Vercel Style) --- */
  .content-tab-container {
    margin: 2.5rem 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    overflow: hidden;
  }

  .content-tab-header {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 1rem;
    gap: 0.25rem;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .content-tab-btn {
    background: transparent;
    border: none;
    padding: 1rem 1.25rem;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    color: #64748b;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .content-tab-btn:hover {
    color: #0f172a;
    background-color: rgba(100, 116, 139, 0.04);
  }

  .content-tab-btn.active {
    color: #7c3aed; /* Vibrant modern tech purple */
    font-weight: 600;
    border-bottom-color: #7c3aed;
    background-color: #ffffff;
  }

  .content-tab-pane {
    display: none;
    padding: 2.5rem;
    background-color: #ffffff;
  }

  .content-tab-pane.active {
    display: block;
    animation: fadeIn 0.2s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const savedTab = localStorage.getItem("portfolio-content-tab-pref");
    if (savedTab) {
      activateTab(savedTab);
    }

    document.addEventListener("click", function (event) {
      const button = event.target.closest(".content-tab-btn");
      if (!button) return;

      const targetLang = button.getAttribute("data-target");
      if (!targetLang) return;
      
      localStorage.setItem("portfolio-content-tab-pref", targetLang);
      activateTab(targetLang);
    });

    function activateTab(lang) {
      const containers = document.querySelectorAll(".content-tab-container");

      containers.forEach(container => {
        const buttons = container.querySelectorAll(".content-tab-btn");
        const panes = container.querySelectorAll(".content-tab-pane");

        let matched = false;

        buttons.forEach(btn => {
          if (btn.getAttribute("data-target") === lang) {
            btn.classList.add("active");
            matched = true;
          } else {
            btn.classList.remove("active");
          }
        });

        panes.forEach(pane => {
          if (pane.getAttribute("data-content") === lang) {
            pane.classList.add("active");
          } else {
            pane.classList.remove("active");
          }
        });
        
        if (!matched && buttons.length > 0) {
          buttons[0].classList.add("active");
          panes[0].classList.add("active");
        }
      });
    }
  });
</script>
