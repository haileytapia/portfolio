<style>
  /* --- Minimalist Trackless Documentation Tabs --- */
  .content-tab-container {
    margin: 2rem 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    overflow: hidden;
  }

  .content-tab-container--inline {
    margin: 1.25rem 0;
    width: fit-content;
    max-width: 100%;
    overflow: visible;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03);
  }

  .content-tab-container--inline .content-tab-header {
    padding: 0 0.75rem;
  }

  .content-tab-container--inline .content-tab-pane {
    padding: 1rem;
    background: #ffffff;
  }

  .content-tab-header {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 1.25rem;
    gap: 0.5rem;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .content-tab-btn {
    background: transparent;
    border: none;
    padding: 0.875rem 1.125rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    color: #64748b;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s ease;
  }

  .content-tab-btn:hover {
    color: #0f172a;
    background-color: #f8fafc;
    border-radius: 6px 6px 0 0;
  }

  .content-tab-btn.active {
    color: #7c3aed;
    font-weight: 600;
    border-bottom-color: #7c3aed;
    background: transparent;
  }

  .content-tab-pane {
    display: none;
    padding: 2rem;
    background-color: #ffffff;
  }

  .content-tab-pane > *:first-child {
    margin-top: 0 !important;
  }

  .content-tab-pane.active {
    display: block;
    animation: fadeIn 0.15s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const containers = Array.from(document.querySelectorAll(".content-tab-container"));
    const initializedGroups = new Set();

    containers.forEach(container => {
      const groupId = container.getAttribute("data-tab-group");
      const groupKey = groupId ? `group:${groupId}` : container;
      if (initializedGroups.has(groupKey)) return;
      initializedGroups.add(groupKey);

      const groupContainers = getGroupContainers(container);
      const buttons = groupContainers.flatMap(item =>
        Array.from(item.querySelectorAll(".content-tab-btn"))
      );
      const savedTab = groupId
        ? localStorage.getItem(`portfolio-content-tab-pref:${groupId}`)
        : null;
      const initialTab = savedTab || buttons[0]?.getAttribute("data-target");
      if (initialTab) activateTab(groupContainers, initialTab);
    });

    document.addEventListener("click", function (event) {
      const button = event.target.closest(".content-tab-btn");
      if (!button) return;

      const targetLang = button.getAttribute("data-target");
      if (!targetLang) return;

      const container = button.closest(".content-tab-container");
      if (!container) return;
      const groupId = container.getAttribute("data-tab-group");
      if (groupId) {
        localStorage.setItem(`portfolio-content-tab-pref:${groupId}`, targetLang);
      }
      activateTab(getGroupContainers(container), targetLang);
    });

    function getGroupContainers(container) {
      const groupId = container.getAttribute("data-tab-group");
      if (!groupId) return [container];

      return containers.filter(item => item.getAttribute("data-tab-group") === groupId);
    }

    function activateTab(groupContainers, lang) {
      const buttons = groupContainers.flatMap(container =>
        Array.from(container.querySelectorAll(".content-tab-btn"))
      );
      const panes = groupContainers.flatMap(container =>
        Array.from(container.querySelectorAll(".content-tab-pane"))
      );
      const activeLang = buttons.some(btn => btn.getAttribute("data-target") === lang)
        ? lang
        : buttons[0]?.getAttribute("data-target");

      buttons.forEach(btn => {
        const isActive = btn.getAttribute("data-target") === activeLang;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      panes.forEach(pane => {
        pane.classList.toggle("active", pane.getAttribute("data-content") === activeLang);
      });
    }
  });
</script>

{% if page.url != '/' and page.url != '/index.html' and page.toc != false %}
<style>
  /* --- Editorial Top-Card TOC (Theme-Aligned) --- */
  .doc-top-toc {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0 2.5rem 0;
  }

  .doc-top-toc .toc-heading {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #0f172a;
    margin-bottom: 0.75rem;
  }

  .doc-top-toc ul {
    list-style: none;
    padding-left: 0;
    margin: 0;
    display: grid;
    gap: 0.5rem;
    /* Automatically creates a tidy 2-column list if you have many headers */
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  }

  .doc-top-toc a {
    color: #475569;
    text-decoration: none;
    font-size: 0.9rem;
    display: flex;
    align-items: center;
    transition: color 0.15s ease;
  }

  .doc-top-toc a::before {
    content: "→";
    margin-right: 8px;
    color: #94a3b8;
    font-size: 0.8rem;
  }

  .doc-top-toc a:hover {
    color: #7c3aed; /* Your purple accent */
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const mainContent = document.querySelector(".doc-main-content");
    if (!mainContent) return;

    // Scan ONLY H2 headers (excluding tab contents)
    const headings = Array.from(mainContent.querySelectorAll("h2"))
      .filter(heading => !heading.closest(".content-tab-pane"));

    // If an article has fewer than 2 H2s, skip the TOC card
    if (headings.length < 2) return;

    const tocBox = document.createElement("nav");
    tocBox.className = "doc-top-toc";
    tocBox.setAttribute("aria-label", "Table of contents");
    
    tocBox.innerHTML = '<div class="toc-heading">Table of contents</div>';
    
    const list = document.createElement("ul");
    const usedIds = new Set();

    headings.forEach((heading, index) => {
      if (!heading.id) {
        const baseId = heading.textContent
          .toLowerCase()
          .replace(/[^\w]+/g, "-")
          .replace(/^-+|-+$/g, "") || `section-${index + 1}`;
        let headingId = baseId;
        let suffix = 2;
        while (document.getElementById(headingId) || usedIds.has(headingId)) {
          headingId = `${baseId}-${suffix++}`;
        }
        heading.id = headingId;
      }
      usedIds.add(heading.id);

      const item = document.createElement("li");
      const link = document.createElement("a");
      link.href = `#${heading.id}`;
      link.textContent = heading.textContent;
      item.appendChild(link);
      list.appendChild(item);
    });

    tocBox.appendChild(list);

    // Inject at the very top of the main content area
    mainContent.insertBefore(tocBox, mainContent.firstChild);
  });
</script>
{% endif %}
