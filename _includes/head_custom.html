<style>
  /* --- Minimalist Trackless Documentation Tabs --- */
  .content-tab-container {
    margin: 2rem 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    overflow: hidden;
  }

  .content-tab-header {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 1.25rem;
    gap: 0.5rem;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .content-tab-btn {
    background: transparent;
    border: none;
    padding: 0.875rem 1.125rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    color: #64748b;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s ease;
  }

  .content-tab-btn:hover {
    color: #0f172a;
    background-color: #f8fafc;
    border-radius: 6px 6px 0 0;
  }

  .content-tab-btn.active {
    color: #7c3aed;
    font-weight: 600;
    border-bottom-color: #7c3aed;
    background: transparent;
  }

  .content-tab-pane {
    display: none;
    padding: 2rem;
    background-color: #ffffff;
  }

  .content-tab-pane > *:first-child {
    margin-top: 0 !important;
  }

  .content-tab-pane.active {
    display: block;
    animation: fadeIn 0.15s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const savedTab = localStorage.getItem("portfolio-content-tab-pref");
    const initialTab = savedTab || document.querySelector(".content-tab-btn")?.getAttribute("data-target");
    if (initialTab) activateTab(initialTab);

    document.addEventListener("click", function (event) {
      const button = event.target.closest(".content-tab-btn");
      if (!button) return;

      const targetLang = button.getAttribute("data-target");
      if (!targetLang) return;
      
      localStorage.setItem("portfolio-content-tab-pref", targetLang);
      activateTab(targetLang);
    });

    function activateTab(lang) {
      const buttons = Array.from(document.querySelectorAll(".content-tab-btn"));
      const panes = document.querySelectorAll(".content-tab-pane");
      const activeLang = buttons.some(btn => btn.getAttribute("data-target") === lang)
        ? lang
        : buttons[0]?.getAttribute("data-target");

      buttons.forEach(btn => {
        const isActive = btn.getAttribute("data-target") === activeLang;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      panes.forEach(pane => {
        pane.classList.toggle("active", pane.getAttribute("data-content") === activeLang);
      });
    }
  });
</script>
