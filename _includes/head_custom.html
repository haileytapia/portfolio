<style>
  /* --- Minimalist Trackless Documentation Tabs --- */
  .content-tab-container {
    margin: 2rem 0;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
    overflow: hidden;
  }

  .content-tab-container--inline {
    margin: 1.25rem 0;
    width: fit-content;
    max-width: 100%;
    overflow: visible;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.03);
  }

  .content-tab-container--inline .content-tab-header {
    padding: 0 0.75rem;
  }

  .content-tab-container--inline .content-tab-pane {
    padding: 1rem;
    background: #ffffff;
  }

  .content-tab-header {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 1.25rem;
    gap: 0.5rem;
    white-space: nowrap;
    -webkit-overflow-scrolling: touch;
  }

  .content-tab-btn {
    background: transparent;
    border: none;
    padding: 0.875rem 1.125rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    color: #64748b;
    border-bottom: 3px solid transparent;
    margin-bottom: -1px;
    transition: all 0.15s ease;
  }

  .content-tab-btn:hover {
    color: #0f172a;
    background-color: #f8fafc;
    border-radius: 6px 6px 0 0;
  }

  .content-tab-btn.active {
    color: #7c3aed;
    font-weight: 600;
    border-bottom-color: #7c3aed;
    background: transparent;
  }

  .content-tab-pane {
    display: none;
    padding: 2rem;
    background-color: #ffffff;
  }

  .content-tab-pane > *:first-child {
    margin-top: 0 !important;
  }

  .content-tab-pane.active {
    display: block;
    animation: fadeIn 0.15s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(2px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const containers = Array.from(document.querySelectorAll(".content-tab-container"));
    const initializedGroups = new Set();

    containers.forEach(container => {
      const groupId = container.getAttribute("data-tab-group");
      const groupKey = groupId ? `group:${groupId}` : container;
      if (initializedGroups.has(groupKey)) return;
      initializedGroups.add(groupKey);

      const groupContainers = getGroupContainers(container);
      const buttons = groupContainers.flatMap(item =>
        Array.from(item.querySelectorAll(".content-tab-btn"))
      );
      const savedTab = groupId
        ? localStorage.getItem(`portfolio-content-tab-pref:${groupId}`)
        : null;
      const initialTab = savedTab || buttons[0]?.getAttribute("data-target");
      if (initialTab) activateTab(groupContainers, initialTab);
    });

    document.addEventListener("click", function (event) {
      const button = event.target.closest(".content-tab-btn");
      if (!button) return;

      const targetLang = button.getAttribute("data-target");
      if (!targetLang) return;

      const container = button.closest(".content-tab-container");
      if (!container) return;
      const groupId = container.getAttribute("data-tab-group");
      if (groupId) {
        localStorage.setItem(`portfolio-content-tab-pref:${groupId}`, targetLang);
      }
      activateTab(getGroupContainers(container), targetLang);
    });

    function getGroupContainers(container) {
      const groupId = container.getAttribute("data-tab-group");
      if (!groupId) return [container];

      return containers.filter(item => item.getAttribute("data-tab-group") === groupId);
    }

    function activateTab(groupContainers, lang) {
      const buttons = groupContainers.flatMap(container =>
        Array.from(container.querySelectorAll(".content-tab-btn"))
      );
      const panes = groupContainers.flatMap(container =>
        Array.from(container.querySelectorAll(".content-tab-pane"))
      );
      const activeLang = buttons.some(btn => btn.getAttribute("data-target") === lang)
        ? lang
        : buttons[0]?.getAttribute("data-target");

      buttons.forEach(btn => {
        const isActive = btn.getAttribute("data-target") === activeLang;
        btn.classList.toggle("active", isActive);
        btn.setAttribute("aria-pressed", String(isActive));
      });

      panes.forEach(pane => {
        pane.classList.toggle("active", pane.getAttribute("data-content") === activeLang);
      });
    }
  });
</script>

{% if page.url != '/' and page.url != '/index.html' and page.layout != 'landing' and page.layout != 'hub' and page.layout != 'home' and page.toc != false %}
<style>
  /* --- Clean Compact TOC with Properly Spaced Custom Bullets --- */
  .doc-top-toc {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 0.85rem 1.15rem 0.85rem 1.35rem;
    margin: 1.25rem 0 1.75rem 0;
    width: fit-content;
    min-width: 260px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
  }

  .doc-top-toc .toc-heading {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #64748b;
    margin-bottom: 0.35rem;
  }

  .doc-top-toc ul.toc-list {
    list-style: none !important;
    padding-left: 0 !important;
    margin: 0 !important;
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }

  .doc-top-toc li {
    list-style: none !important;
    margin: 0 !important;
    padding-left: 1.1rem !important;
    position: relative !important;
  }

  .doc-top-toc li::before {
    content: "" !important;
    position: absolute !important;
    left: 0.25rem !important;
    top: 0.55em !important;
    width: 5px !important;
    height: 5px !important;
    background-color: #94a3b8 !important;
    border-radius: 50% !important;
    display: inline-block !important;
  }

  .doc-top-toc li::after {
    content: none !important;
    display: none !important;
  }

  .doc-top-toc a {
    color: #475569;
    text-decoration: none;
    font-size: 0.85rem;
    line-height: 1.35;
    display: inline;
    transition: color 0.15s ease;
  }

  .doc-top-toc a:hover {
    color: #7c3aed;
    text-decoration: underline;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    try {
      const mainContent = document.querySelector("article") || 
                          document.querySelector(".main-content") || 
                          document.querySelector(".doc-main-content") || 
                          document.querySelector(".page-content") || 
                          document.querySelector("main") || 
                          document.body;
                          
      if (!mainContent) return;

      // 1. Initialize tabs with robust attribute matching
      const containers = Array.from(document.querySelectorAll(".content-tab-container"));
      containers.forEach(container => {
        const groupId = container.getAttribute("data-tab-group");
        const savedTab = groupId ? localStorage.getItem(`portfolio-content-tab-pref:${groupId}`) : null;
        const buttons = Array.from(container.querySelectorAll(".content-tab-btn"));
        const panes = Array.from(container.querySelectorAll(".content-tab-pane"));
        
        if (buttons.length > 0 && panes.length > 0) {
          const getTabKey = (el) => el.getAttribute("data-target") || el.getAttribute("data-lang") || el.getAttribute("data-tab");
          const getPaneKey = (el) => el.getAttribute("data-content") || el.getAttribute("data-lang") || el.getAttribute("data-tab");

          const target = savedTab && buttons.some(b => getTabKey(b) === savedTab) 
            ? savedTab 
            : getTabKey(buttons[0]);
          
          buttons.forEach(btn => {
            btn.classList.toggle("active", getTabKey(btn) === target);
          });
          panes.forEach(pane => {
            pane.classList.toggle("active", getPaneKey(pane) === target);
          });
        }
      });

      // 2. Dynamic TOC Generator
      window.updateDynamicTOC = function() {
        let existingToc = document.querySelector(".doc-top-toc");
        if (existingToc) existingToc.remove();
        
        const allHeadings = Array.from(mainContent.querySelectorAll("h2")).filter(heading => {
          return !heading.closest("nav") && 
                 !heading.closest("header") && 
                 !heading.closest("footer") && 
                 !heading.closest(".side-bar") && 
                 !heading.closest(".site-header") && 
                 !heading.closest(".site-nav") &&
                 !heading.closest(".doc-top-toc") &&
                 !heading.closest(".card") &&
                 !heading.closest(".cards") &&
                 !heading.closest(".grid") &&
                 !heading.closest(".collection") &&
                 !heading.closest("a");
        });

        const validHeadings = allHeadings.filter(heading => {
          const pane = heading.closest(".content-tab-pane");
          if (pane) {
            return pane.classList.contains("active");
          }
          return true;
        });

        if (validHeadings.length === 0) return;

        const tocBox = document.createElement("nav");
        tocBox.className = "doc-top-toc";
        tocBox.setAttribute("aria-label", "In this article");
        tocBox.innerHTML = '<div class="toc-heading">In this article</div><ul class="toc-list"></ul>';

        const list = tocBox.querySelector("ul.toc-list");
        const usedIds = new Set();
        validHeadings.forEach((heading, index) => {
          if (!heading.id) {
            const baseId = heading.textContent
              .toLowerCase()
              .replace(/[^\w]+/g, "-")
              .replace(/^-+|-+$/g, "") || `section-${index + 1}`;
            let headingId = baseId;
            let suffix = 2;
            while (document.getElementById(headingId) && document.getElementById(headingId) !== heading || usedIds.has(headingId)) {
              headingId = `${baseId}-${suffix++}`;
            }
            heading.id = headingId;
          }
          usedIds.add(heading.id);

          const item = document.createElement("li");
          const link = document.createElement("a");
          link.href = `#${heading.id}`;
          link.textContent = heading.textContent;
          item.appendChild(link);
          list.appendChild(item);
        });

        const firstValidHeading = validHeadings[0];
        const activePane = firstValidHeading.closest(".content-tab-pane");

        if (activePane) {
          activePane.insertBefore(tocBox, activePane.firstChild);
        } else {
          const h1 = mainContent.querySelector("h1") || document.querySelector("h1");
          if (h1) {
            let insertAfterNode = h1;
            let nextElem = h1.nextElementSibling;
            
            if (nextElem && (nextElem.tagName === 'P' || nextElem.classList.contains('fs-3') || nextElem.classList.contains('text-meta'))) {
              insertAfterNode = nextElem;
            }

            if (insertAfterNode.nextSibling) {
              insertAfterNode.parentNode.insertBefore(tocBox, insertAfterNode.nextSibling);
            } else {
              insertAfterNode.parentNode.appendChild(tocBox);
            }
          } else {
            mainContent.insertBefore(tocBox, mainContent.firstChild);
          }
        }
      };

      // Initial build
      window.updateDynamicTOC();

      // 3. Tab Click Handler
      document.addEventListener("click", function (event) {
        const button = event.target.closest(".content-tab-btn");
        if (!button) return;

        const getTabKey = (el) => el.getAttribute("data-target") || el.getAttribute("data-lang") || el.getAttribute("data-tab");
        const getPaneKey = (el) => el.getAttribute("data-content") || el.getAttribute("data-lang") || el.getAttribute("data-tab");

        const targetLang = getTabKey(button);
        if (!targetLang) return;

        const container = button.closest(".content-tab-container");
        if (!container) return;
        const groupId = container.getAttribute("data-tab-group");
        if (groupId) {
          localStorage.setItem(`portfolio-content-tab-pref:${groupId}`, targetLang);
        }
        
        const groupContainers = groupId 
          ? containers.filter(item => item.getAttribute("data-tab-group") === groupId)
          : [container];

        groupContainers.forEach(gc => {
          const btns = Array.from(gc.querySelectorAll(".content-tab-btn"));
          const panes = Array.from(gc.querySelectorAll(".content-tab-pane"));
          
          btns.forEach(btn => {
            const active = getTabKey(btn) === targetLang;
            btn.classList.toggle("active", active);
          });
          panes.forEach(pane => {
            const active = getPaneKey(pane) === targetLang;
            pane.classList.toggle("active", active);
          });
        });

        requestAnimationFrame(() => {
          if (typeof window.updateDynamicTOC === 'function') {
            window.updateDynamicTOC();
          }
        });
      });
    } catch (err) {
      console.error("Documentation script error:", err);
    }
  });
</script>
{% endif %}
