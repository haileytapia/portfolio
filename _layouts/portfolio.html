---
layout: default
---

<div class="doc-layout-container">
  <div class="doc-main-content">
    {{ content }}
  </div>

</div>

{% if page.toc != false %}
<aside id="doc-toc-rail" class="doc-toc-rail">
  <button id="doc-toc-toggle" class="doc-toc-toggle" type="button" aria-expanded="false" aria-controls="auto-toc">
    In this article
  </button>
  <nav id="auto-toc" class="doc-toc-panel" aria-label="In this article" hidden></nav>
</aside>
{% endif %}
